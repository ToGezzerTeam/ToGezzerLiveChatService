services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: togezzer-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - togezzer

  app:
    image: ghcr.io/togezzerteam/togezzerlivechatservice/livechat-service:latest
    container_name: togezzer-live-chat-service
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3001:3000"
      - "40000-40010:40000-40010/udp"
    environment:
      PORT: 3000
      RABBITMQ_HOST: rabbitmq  # nom du service, plus localhost
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      MEDIASOUP_MIN_PORT: 40000
      MEDIASOUP_MAX_PORT: 44999  # aligné avec les ports exposés
    networks:
      - togezzer

networks:
  togezzer:
    driver: bridge